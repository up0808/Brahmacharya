<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rankings - Prabhu Naam Jaap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #ff6b35;
      --primary-dark: #e85a2a;
      --secondary: #f7931e;
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text: #2d3436;
      --text-light: #636e72;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-link {
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      transition: var(--transition);
      font-size: 14px;
    }

    .nav-link:hover {
      background: var(--bg);
    }

    .page-title {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .page-title h1 {
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-title p {
      color: var(--text-light);
    }

    .search-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .search-input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .rankings-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rank-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 20px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .rank-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .rank-badge {
      font-size: 24px;
      font-weight: 700;
      min-width: 50px;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      background: var(--bg);
    }

    .rank-card:nth-child(1) .rank-badge {
      background: linear-gradient(135deg, var(--gold), #ffed4e);
      color: #8b6914;
    }

    .rank-card:nth-child(2) .rank-badge {
      background: linear-gradient(135deg, var(--silver), #e8e8e8);
      color: #5a5a5a;
    }

    .rank-card:nth-child(3) .rank-badge {
      background: linear-gradient(135deg, var(--bronze), #e8a87c);
      color: #6b4423;
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }

    .spiritual-name {
      font-size: 14px;
      color: var(--text-light);
      font-style: italic;
      margin-bottom: 4px;
    }

    .profile-deity {
      font-size: 14px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .count-display {
      text-align: right;
    }

    .count-value {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .count-label {
      font-size: 12px;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .empty-state p {
      color: var(--text-light);
      font-size: 16px;
    }

    .error-message {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .error-message h2 {
      color: #e74c3c;
      margin-bottom: 16px;
    }

    .hidden {
      display: none !important;
    }

    .your-rank-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .load-more {
      text-align: center;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        text-align: center;
      }

      .rank-card {
        flex-direction: column;
        text-align: center;
      }

      .count-display {
        text-align: center;
      }

      .profile-deity {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="logo">🙏 Prabhu Naam Jaap</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Counters</a>
        <a href="profile.html" class="nav-link">My Profile</a>
      </div>
    </div>

    <div class="page-title">
      <h1>🏆 Global Rankings</h1>
      <p>Top devotees ranked by their highest naam jaap count</p>
    </div>

    <div id="authRequired" class="error-message hidden">
      <h2>🔒 Sign In Required</h2>
      <p>Please sign in to view rankings</p>
      <a href="index.html" class="btn" style="display: inline-block; margin-top: 16px; text-decoration: none;">
        Go to Home
      </a>
    </div>

    <div id="mainContent" class="hidden">
      <div class="search-section">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="🔍 Search by name..."
          aria-label="Search profiles"
        >
      </div>

      <div id="loadingSection" class="loading">
        <div class="loading-spinner"></div>
        <p>Loading rankings...</p>
      </div>

      <div id="rankingsList" class="rankings-list hidden"></div>

      <div id="emptyState" class="empty-state hidden">
        <p>No public profiles found. Be the first to make your profile public! 🌟</p>
      </div>

      <div id="loadMore" class="load-more hidden">
        <button id="loadMoreBtn" class="btn">Load More</button>
      </div>
    </div>
  </div>

  <script src="env.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { 
      getAuth, 
      onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { 
      getFirestore, 
      collection,
      doc,
      getDoc,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      startAfter
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Check env vars
    if (!window.__ENV__) {
      document.body.innerHTML = `
        <div style="max-width: 600px; margin: 100px auto; padding: 40px; background: white; border-radius: 12px; text-align: center;">
          <h2 style="color: #e74c3c; margin-bottom: 20px;">⚠️ Configuration Missing</h2>
          <p>Environment variables not configured. Please see setup instructions.</p>
        </div>
      `;
      throw new Error('Environment variables not configured');
    }

    const firebaseConfig = {
      apiKey: window.__ENV__.FIREBASE_API_KEY,
      authDomain: window.__ENV__.FIREBASE_AUTH_DOMAIN,
      projectId: window.__ENV__.FIREBASE_PROJECT_ID,
      storageBucket: window.__ENV__.FIREBASE_STORAGE_BUCKET,
      messagingSenderId: window.__ENV__.FIREBASE_MESSAGING_SENDER_ID,
      appId: window.__ENV__.FIREBASE_APP_ID,
      measurementId: window.__ENV__.FIREBASE_MEASUREMENT_ID
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // State
    let currentUser = null;
    let allProfiles = [];
    let filteredProfiles = [];
    let displayedCount = 20;
    const LOAD_MORE_COUNT = 20;

    // DOM Elements
    const authRequired = document.getElementById('authRequired');
    const mainContent = document.getElementById('mainContent');
    const loadingSection = document.getElementById('loadingSection');
    const rankingsList = document.getElementById('rankingsList');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const loadMore = document.getElementById('loadMore');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    // Auth state listener
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      
      if (!user) {
        authRequired.classList.remove('hidden');
        mainContent.classList.add('hidden');
        return;
      }

      authRequired.classList.add('hidden');
      mainContent.classList.remove('hidden');

      await loadRankings();
    });

    // Load all public profiles and rank them
    async function loadRankings() {
      try {
        loadingSection.classList.remove('hidden');
        rankingsList.classList.add('hidden');
        emptyState.classList.add('hidden');

        // Get all users
        const usersRef = collection(db, 'users');
        const usersSnapshot = await getDocs(usersRef);

        const profiles = [];

        // Fetch each user's profile
        for (const userDoc of usersSnapshot.docs) {
          const profileRef = doc(db, 'users', userDoc.id, 'profile', 'data');
          const profileSnap = await getDoc(profileRef);

          if (profileSnap.exists()) {
            const profileData = profileSnap.data();
            
            // Only include public profiles (or current user's profile)
            if (profileData.profilePublic || userDoc.id === currentUser.uid) {
              profiles.push({
                uid: userDoc.id,
                ...profileData,
                isCurrentUser: userDoc.id === currentUser.uid
              });
            }
          }
        }

        // Sort by highestNaamJaapCount descending
        profiles.sort((a, b) => {
          const aCount = a.highestNaamJaapCount || 0;
          const bCount = b.highestNaamJaapCount || 0;
          return bCount - aCount;
        });

        // Assign ranks
        profiles.forEach((profile, index) => {
          profile.rank = index + 1;
        });

        allProfiles = profiles;
        filteredProfiles = profiles;

        renderRankings();

        loadingSection.classList.add('hidden');

        if (profiles.length === 0) {
          emptyState.classList.remove('hidden');
        }

      } catch (error) {
        console.error('Error loading rankings:', error);
        loadingSection.classList.add('hidden');
        rankingsList.innerHTML = `
          <div class="error-message">
            <h2>⚠️ Error Loading Rankings</h2>
            <p>${error.message || 'Failed to load rankings'}</p>
            <button onclick="location.reload()" class="btn" style="margin-top: 16px;">Retry</button>
          </div>
        `;
        rankingsList.classList.remove('hidden');
      }
    }

    // Render rankings list
    function renderRankings() {
      const profilesToShow = filteredProfiles.slice(0, displayedCount);

      if (profilesToShow.length === 0) {
        emptyState.classList.remove('hidden');
        rankingsList.classList.add('hidden');
        loadMore.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      rankingsList.classList.remove('hidden');

      rankingsList.innerHTML = profilesToShow.map(profile => {
        const displayName = escapeHtml(profile.displayName || 'Anonymous');
        const spiritualName = profile.spiritualName ? escapeHtml(profile.spiritualName) : '';
        const avatar = profile.avatarUrl || 'https://via.placeholder.com/60';
        const count = profile.highestNaamJaapCount || 0;
        const deity = profile.topDeityName ? escapeHtml(profile.topDeityName) : 'No deity yet';
        const rank = profile.rank;

        const yourBadge = profile.isCurrentUser ? '<div class="your-rank-badge">You</div>' : '';

        return `
          <div class="rank-card" data-uid="${profile.uid}" role="button" tabindex="0" aria-label="View ${displayName}'s profile">
            ${yourBadge}
            <div class="rank-badge">#${rank}</div>
            <img src="${avatar}" alt="${displayName}" class="profile-avatar">
            <div class="profile-info">
              <div class="profile-name">${displayName}</div>
              ${spiritualName ? `<div class="spiritual-name">"${spiritualName}"</div>` : ''}
              <div class="profile-deity">🙏 Top: ${deity}</div>
            </div>
            <div class="count-display">
              <div class="count-value">${count}</div>
              <div class="count-label">Highest Count</div>
            </div>
          </div>
        `;
      }).join('');

      // Attach click listeners
      document.querySelectorAll('.rank-card').forEach(card => {
        card.addEventListener('click', () => {
          const uid = card.dataset.uid;
          viewProfile(uid);
        });

        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const uid = card.dataset.uid;
            viewProfile(uid);
          }
        });
      });

      // Show/hide load more button
      if (filteredProfiles.length > displayedCount) {
        loadMore.classList.remove('hidden');
      } else {
        loadMore.classList.add('hidden');
      }
    }

    // View profile
    function viewProfile(uid) {
      if (uid === currentUser.uid) {
        window.location.href = 'profile.html';
      } else {
        window.location.href = `profile.html?uid=${uid}`;
      }
    }

    // Search functionality
    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();

      if (!searchTerm) {
        filteredProfiles = allProfiles;
      } else {
        filteredProfiles = allProfiles.filter(profile => {
          const displayName = (profile.displayName || '').toLowerCase();
          const spiritualName = (profile.spiritualName || '').toLowerCase();
          return displayName.includes(searchTerm) || spiritualName.includes(searchTerm);
        });
      }

      displayedCount = LOAD_MORE_COUNT;
      renderRankings();
    });

    // Load more button
    loadMoreBtn.addEventListener('click', () => {
      displayedCount += LOAD_MORE_COUNT;
      renderRankings();
    });

    // Utility function
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>

<!--
═══════════════════════════════════════════════════════════════════════════════
  PROFILE LIST / RANKINGS PAGE - FEATURES
═══════════════════════════════════════════════════════════════════════════════

✨ FEATURES:
   • Global rankings of all public profiles
   • Ranked by highest single naam jaap count across all counters
   • Search functionality (filters by display name or spiritual name)
   • Load more pagination (20 profiles at a time)
   • Click/tap any profile to view their full profile
   • Special badges for top 3 ranks (gold, silver, bronze)
   • "You" badge highlights current user's position
   • Shows: rank, avatar, name, spiritual name, top deity, highest count
   • Only displays public profiles (except current user always sees themselves)
   • Responsive design for mobile and desktop
   • Keyboard accessible (Enter/Space to view profile)

🏆 RANKING LOGIC:
   • Each user's score = max(count) across all their counters
   • Profiles sorted descending by score
   • Ranks assigned sequentially (1, 2, 3, ...)
   • Computed on client-side from denormalized highestNaamJaapCount field

🔍 SEARCH:
   • Real-time client-side filtering
   • Searches both display name and spiritual name
   • Case-insensitive
   • Resets pagination when searching

📄 PAGINATION:
   • Initially shows 20 profiles
   • "Load More" button loads 20 more
   • Hides when all profiles displayed

🔒 PRIVACY:
   • Only public profiles shown (profilePublic == true)
   • Current user always sees themselves in list
   • Clicking a profile navigates to profile.html?uid=OTHER_UID
   • If viewing own profile, navigates to profile.html (no uid param)

🎨 UX:
   • Beautiful gradient header
   • Special styling for top 3 ranks
   • Smooth hover effects
   • Loading spinner while fetching
   • Empty state if no public profiles
   • Error handling with retry button

═══════════════════════════════════════════════════════════════════════════════

FIRESTORE SECURITY RULES (REQUIRED - PUBLISH IN FIREBASE CONSOLE):

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // Counters: only owner can read/write
    match /users/{userId}/counters/{counterId} {
      allow read, write: if request.auth != null && request.auth.uid == userId;
    }
    
    // Profile: owner can write, anyone can read if public
    match /users/{userId}/profile/{document} {
      allow write: if request.auth != null && request.auth.uid == userId;
      allow read: if (request.auth != null && request.auth.uid == userId)
                  || (get(/databases/$(database)/documents/users/$(userId)/profile/data).data.profilePublic == true);
    }
  }
}

INSTRUCTIONS TO PUBLISH RULES:
1. Go to Firebase Console: https://console.firebase.google.com
2. Select your project
3. Navigate to Firestore Database > Rules
4. Replace the existing rules with the above
5. Click "Publish"

CREATE env.js GENERATOR:

Create generate-env.js in project root:

```javascript
const fs = require('fs');

const envContent = `
window.__ENV__ = {
  FIREBASE_API_KEY: "${process.env.VERCEL_PUBLIC_FIREBASE_API_KEY || ''}",
  FIREBASE_AUTH_DOMAIN: "${process.env.VERCEL_PUBLIC_FIREBASE_AUTH_DOMAIN || ''}",
  FIREBASE_PROJECT_ID: "${process.env.VERCEL_PUBLIC_FIREBASE_PROJECT_ID || ''}",
  FIREBASE_STORAGE_BUCKET: "${process.env.VERCEL_PUBLIC_FIREBASE_STORAGE_BUCKET || ''}",
  FIREBASE_MESSAGING_SENDER_ID: "${process.env.VERCEL_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || ''}",
  FIREBASE_APP_ID: "${process.env.VERCEL_PUBLIC_FIREBASE_APP_ID || ''}",
  FIREBASE_MEASUREMENT_ID: "${process.env.VERCEL_PUBLIC_FIREBASE_MEASUREMENT_ID || ''}",
  GOOGLE_OAUTH_CLIENT_ID: "${process.env.VERCEL_PUBLIC_GOOGLE_OAUTH_CLIENT_ID || ''}"
};
`;

// Ensure public directory exists
if (!fs.existsSync('public')) {
  fs.mkdirSync('public');
}

fs.writeFileSync('public/env.js', envContent);
console.log('✓ env.js generated successfully');
```

Create package.json (if not exists):

```json

  "name": "prabhu-naam-jaap",
  "version": "1.0.0",
  "scripts": {
    "build": "node generate-env.js"
  }
}
```

DATA FLOW EXPLANATION:

1. User signs in via index.html (Google Sign-In + One-Tap)
2. Firebase Auth creates user account
3. index.html creates initial profile document at /users/{uid}/profile/data
4. User adds naam jaap counters at /users/{uid}/counters/{counterId}
5. Each counter increment uses a transaction to:
   - Update counter.count
   - Check if new count > profile.highestNaamJaapCount
   - If yes, update profile.highestNaamJaapCount and topDeityName
6. profile.html allows editing profile fields and privacy toggle
7. profilelist.html queries all public profiles and sorts by highestNaamJaapCount
8. Rankings are computed client-side based on denormalized data

DENORMALIZATION STRATEGY:
- profile.highestNaamJaapCount is updated atomically with counter increments
- This avoids expensive queries across all counters for every profile
- Trade-off: Slight complexity in increment logic for fast ranking queries
