<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prabhu Naam Jaap</title>
  <style>
    /* Modern CSS Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #ff6b35;
      --primary-dark: #e85a2a;
      --secondary: #f7931e;
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text: #2d3436;
      --text-light: #636e72;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name {
      font-weight: 600;
      color: var(--text);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #f0f0f0;
    }

    /* Auth Section */
    .auth-section {
      text-align: center;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 48px 24px;
      box-shadow: var(--shadow);
    }

    .auth-section h1 {
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--text);
    }

    .auth-section p {
      color: var(--text-light);
      margin-bottom: 32px;
      font-size: 16px;
    }

    #g_id_onload {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    /* Add Counter Form */
    .add-counter-form {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .form-group {
      display: flex;
      gap: 12px;
    }

    .form-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      transition: var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Counters Grid */
    .counters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .counter-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .counter-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .counter-card h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .counter-card .count {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .counter-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      font-size: 16px;
    }

    .icon-btn:hover {
      background: var(--border);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
      animation: modalIn 0.3s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-light);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--bg);
    }

    .modal-title {
      font-size: 28px;
      margin-bottom: 32px;
      color: var(--text);
    }

    .counter-display {
      width: 200px;
      height: 200px;
      margin: 0 auto 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      box-shadow: var(--shadow-lg);
    }

    .counter-display:hover {
      transform: scale(1.05);
    }

    .counter-display:active {
      transform: scale(0.95);
    }

    .empty-state {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .empty-state p {
      color: var(--text-light);
      font-size: 16px;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        text-align: center;
      }
      
      .counters-grid {
        grid-template-columns: 1fr;
      }

      .counter-display {
        width: 160px;
        height: 160px;
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">🙏 Prabhu Naam Jaap</div>
      <div id="userSection" class="hidden">
        <div class="user-info">
          <img id="userAvatar" class="user-avatar" alt="User">
          <span id="userName" class="user-name"></span>
          <button id="signOutBtn" class="btn btn-secondary">Sign Out</button>
        </div>
      </div>
    </div>

    <!-- Auth Section (shown when not logged in) -->
    <div id="authSection" class="auth-section">
      <h1>Welcome to Prabhu Naam Jaap</h1>
      <p>Track your devotional chanting with personalized counters</p>
      <button id="googleSignInBtn" class="btn btn-primary">
        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <!-- Google One-Tap will appear here -->
      <div id="g_id_onload"
           data-client_id="570278183969-8mvvbilfc1es8hdc7oh0b6t3ek6m0j49.apps.googleusercontent.com"
           data-callback="handleOneTapSignIn"
           data-auto_prompt="true">
      </div>
    </div>

    <!-- Main App (shown when logged in) -->
    <div id="appSection" class="hidden">
      <!-- Add Counter Form -->
      <div class="add-counter-form">
        <div class="form-group">
          <input 
            type="text" 
            id="deityInput" 
            class="form-input" 
            placeholder="Enter deity name (e.g., Krishna, Shiva, Ram)"
            maxlength="40"
          >
          <button id="addCounterBtn" class="btn btn-primary">Add Counter</button>
        </div>
        <div id="errorMsg" class="error hidden"></div>
      </div>

      <!-- Counters Grid -->
      <div id="countersGrid" class="counters-grid"></div>
      
      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <p>No counters yet. Add your first deity counter above! 🙏</p>
      </div>
    </div>
  </div>

  <!-- Counter Modal -->
  <div id="counterModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">&times;</button>
      <h2 class="modal-title" id="modalDeityName"></h2>
      <div 
        id="counterDisplay" 
        class="counter-display" 
        role="button" 
        tabindex="0"
        aria-label="Increment counter"
      >0</div>
      <p style="color: var(--text-light); font-size: 14px;">Tap to increment</p>
    </div>
  </div>

  <!-- Firebase SDK (v9+ modular) -->
  <script type="module">
    // ============================================
    // FIREBASE CONFIGURATION
    // ============================================
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBUQeUAnRScv4fedqN53l2Uv-qoR12lcrs",
  authDomain: "godrecite.firebaseapp.com",
  projectId: "godrecite",
  storageBucket: "godrecite.firebasestorage.app",
  messagingSenderId: "570278183969",
  appId: "1:570278183969:web:f68e45d54af37e36dccf60",
  measurementId: "G-WQQN1LBDLX"
};

    // Google OAuth Client ID for One-Tap (from Google Cloud Console)
    const GOOGLE_CLIENT_ID = "570278183969-8mvvbilfc1es8hdc7oh0b6t3ek6m0j49.apps.googleusercontent.com";

    // ============================================
    // FIREBASE IMPORTS
    // ============================================
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signInWithCredential,
      signOut,
      onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      getDoc,
      getDocs,
      updateDoc,
      deleteDoc,
      query,
      orderBy,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // ============================================
    // INITIALIZE FIREBASE
    // ============================================
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // ============================================
    // STATE MANAGEMENT
    // ============================================
    let currentUser = null;
    let counters = {};
    let activeCounterId = null;

    // ============================================
    // DOM ELEMENTS
    // ============================================
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const userSection = document.getElementById('userSection');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const signOutBtn = document.getElementById('signOutBtn');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const deityInput = document.getElementById('deityInput');
    const addCounterBtn = document.getElementById('addCounterBtn');
    const countersGrid = document.getElementById('countersGrid');
    const emptyState = document.getElementById('emptyState');
    const errorMsg = document.getElementById('errorMsg');
    const counterModal = document.getElementById('counterModal');
    const modalDeityName = document.getElementById('modalDeityName');
    const counterDisplay = document.getElementById('counterDisplay');
    const closeModal = document.getElementById('closeModal');

    // ============================================
    // AUTHENTICATION
    // ============================================
    
    // Google Sign-In Button Click Handler
    googleSignInBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error('Sign-in error:', error);
        showError('Failed to sign in. Please try again.');
      }
    });

    // Sign Out Handler
    signOutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error('Sign-out error:', error);
        showError('Failed to sign out.');
      }
    });

    // Google One-Tap Sign-In Handler
    // This function is called by Google Identity Services when user completes One-Tap
    window.handleOneTapSignIn = async (response) => {
      try {
        // Exchange the Google ID token for Firebase credentials
        const credential = GoogleAuthProvider.credential(response.credential);
        await signInWithCredential(auth, credential);
      } catch (error) {
        console.error('One-Tap sign-in error:', error);
      }
    };

    // Auth State Observer
    // Monitors authentication state changes and updates UI accordingly
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      
      if (user) {
        // User is signed in
        authSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        userSection.classList.remove('hidden');
        
        // Update user info display
        userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
        userName.textContent = user.displayName || 'User';
        
        // Load user's counters from Firestore
        await loadCounters();
      } else {
        // User is signed out
        authSection.classList.remove('hidden');
        appSection.classList.add('hidden');
        userSection.classList.add('hidden');
        
        // Clear local state
        counters = {};
        renderCounters();
      }
    });

    // ============================================
    // FIRESTORE OPERATIONS
    // ============================================
    
    // Load all counters for the current user
    async function loadCounters() {
      if (!currentUser) return;
      
      try {
        const countersRef = collection(db, 'users', currentUser.uid, 'counters');
        const q = query(countersRef, orderBy('createdAt', 'asc'));
        const snapshot = await getDocs(q);
        
        counters = {};
        snapshot.forEach(doc => {
          counters[doc.id] = {
            id: doc.id,
            ...doc.data()
          };
        });
        
        renderCounters();
      } catch (error) {
        console.error('Error loading counters:', error);
        showError('Failed to load counters.');
      }
    }

    // Add a new counter
    async function addCounter(name) {
      if (!currentUser) return;
      
      // Validate input
      const trimmedName = name.trim();
      if (!trimmedName) {
        showError('Please enter a deity name.');
        return;
      }
      
      if (trimmedName.length > 40) {
        showError('Name must be 40 characters or less.');
        return;
      }
      
      // Check for duplicates (case-insensitive)
      const normalizedName = trimmedName.toLowerCase();
      const isDuplicate = Object.values(counters).some(
        counter => counter.name.toLowerCase() === normalizedName
      );
      
      if (isDuplicate) {
        showError('A counter with this name already exists.');
        return;
      }
      
      try {
        // Create URL-safe slug for document ID
        const slug = trimmedName.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
        const timestamp = Date.now();
        const counterId = `${slug}-${timestamp}`;
        
        const counterData = {
          name: trimmedName,
          count: 0,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        };
        
        // Save to Firestore
        const counterRef = doc(db, 'users', currentUser.uid, 'counters', counterId);
        await setDoc(counterRef, counterData);
        
        // Update local state
        counters[counterId] = {
          id: counterId,
          ...counterData,
          createdAt: new Date(),
          updatedAt: new Date()
        };
        
        renderCounters();
        deityInput.value = '';
        hideError();
      } catch (error) {
        console.error('Error adding counter:', error);
        showError('Failed to add counter. Please try again.');
      }
    }

    // Increment counter
    async function incrementCounter(counterId) {
      if (!currentUser || !counters[counterId]) return;
      
      const counter = counters[counterId];
      const newCount = counter.count + 1;
      
      // Optimistic update
      counters[counterId].count = newCount;
      counterDisplay.textContent = newCount;
      
      try {
        // Persist to Firestore
        const counterRef = doc(db, 'users', currentUser.uid, 'counters', counterId);
        await updateDoc(counterRef, {
          count: newCount,
          updatedAt: serverTimestamp()
        });
      } catch (error) {
        console.error('Error incrementing counter:', error);
        // Rollback on failure
        counters[counterId].count = newCount - 1;
        counterDisplay.textContent = newCount - 1;
        showError('Failed to save. Please check your connection.');
      }
    }

    // Delete counter
    async function deleteCounter(counterId) {
      if (!currentUser || !counters[counterId]) return;
      
      const counter = counters[counterId];
      if (!confirm(`Delete "${counter.name}" counter?`)) return;
      
      try {
        // Delete from Firestore
        const counterRef = doc(db, 'users', currentUser.uid, 'counters', counterId);
        await deleteDoc(counterRef);
        
        // Update local state
        delete counters[counterId];
        renderCounters();
        
        // Close modal if this counter is active
        if (activeCounterId === counterId) {
          closeCounterModal();
        }
      } catch (error) {
        console.error('Error deleting counter:', error);
        showError('Failed to delete counter.');
      }
    }

    // ============================================
    // UI RENDERING
    // ============================================
    
    function renderCounters() {
      const counterIds = Object.keys(counters);
      
      if (counterIds.length === 0) {
        countersGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      
      emptyState.classList.add('hidden');
      
      countersGrid.innerHTML = counterIds.map(id => {
        const counter = counters[id];
        return `
          <div class="counter-card" data-id="${id}">
            <div class="counter-actions">
              <button class="icon-btn delete-btn" data-id="${id}" title="Delete">🗑️</button>
            </div>
            <h3>${escapeHtml(counter.name)}</h3>
            <div class="count">${counter.count}</div>
          </div>
        `;
      }).join('');
      
      // Attach event listeners
      document.querySelectorAll('.counter-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (!e.target.classList.contains('delete-btn')) {
            openCounterModal(card.dataset.id);
          }
        });
      });
      
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteCounter(btn.dataset.id);
        });
      });
    }

    // ============================================
    // MODAL MANAGEMENT
    // ============================================
    
    function openCounterModal(counterId) {
      activeCounterId = counterId;
      const counter = counters[counterId];
      
      if (!counter) return;
      
      modalDeityName.textContent = counter.name;
      counterDisplay.textContent = counter.count;
      counterModal.classList.add('active');
    }

    function closeCounterModal() {
      counterModal.classList.remove('active');
      activeCounterId = null;
      renderCounters(); // Refresh to show updated counts
    }

    // Counter display click handler
    counterDisplay.addEventListener('click', () => {
      if (activeCounterId) {
        incrementCounter(activeCounterId);
      }
    });

    // Keyboard accessibility for counter
    counterDisplay.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (activeCounterId) {
          incrementCounter(activeCounterId);
        }
      }
    });

    // Close modal handlers
    closeModal.addEventListener('click', closeCounterModal);
    counterModal.addEventListener('click', (e) => {
      if (e.target === counterModal) {
        closeCounterModal();
      }
    });

    // ============================================
    // EVENT LISTENERS
    // ============================================
    
    addCounterBtn.addEventListener('click', () => {
      addCounter(deityInput.value);
    });

    deityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addCounter(deityInput.value);
      }
    });

    // ============================================
    // UTILITY FUNCTIONS
    // ============================================
    
    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.remove('hidden');
      setTimeout(() => hideError(), 5000);
    }

    function hideError() {
      errorMsg.classList.add('hidden');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============================================
    // LOAD GOOGLE ONE-TAP SCRIPT
    // ============================================
    // Load Google Identity Services library for One-Tap
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;
    script.defer = true;
    document.head.appendChild(script);
  </script>
</body>
</html>

<!--

  PRABHU NAAM JAAP COUNTER - SETUP INSTRUCTIONS
═══════════════════════════════════════════════════════════════════

📋 SETUP STEPS:

1. FIREBASE CONFIGURATION:
   • Go to Firebase Console (https://console.firebase.google.com)
   • Create a new project or select existing
   • Go to Project Settings > General > Your apps
   • Copy the firebaseConfig object and replace the placeholder in the code
   • Enable Firestore: Go to Firestore Database > Create database > Start in production mode
   • Enable Authentication: Go to Authentication > Sign-in method > Enable Google

2. GOOGLE OAUTH CLIENT ID (for One-Tap):
   • Go to Google Cloud Console (https://console.cloud.google.com)
   • Select your Firebase project
   • Go to APIs & Services > Credentials
   • Create OAuth 2.0 Client ID (Web application)
   • Add authorized JavaScript origins:
     - http://localhost (for testing)
     - https://your-domain.com (for production)
   • Add authorized redirect URIs:
     - https://your-project-id.firebaseapp.com/__/auth/handler
   • Copy the Client ID and replace GOOGLE_CLIENT_ID in code
   • Also update the data-client_id in the HTML div#g_id_onload

3. FIRESTORE SECURITY RULES:
   • Go to Firestore Database > Rules
   • Replace with the following rules:

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == userId;
    }
  }
}

   • Click "Publish" to save the rules

4. DEPLOY (Optional):
   • Install Firebase CLI: npm install -g firebase-tools
   • Login: firebase login
   • Initialize: firebase init hosting
   • Deploy: firebase deploy --only hosting
   • Or simply host this file on any static hosting service

5. TESTING:
   • Open index.html in a browser
   • For One-Tap to work locally, serve via HTTP (not file://)
   • Use: python -m http.server 8000 or npx serve

✨ FEATURES:
   • Google Sign-In button + One-Tap automatic sign-in
   • Personalized counters per user (stored in Firestore)
   • Real-time persistence with optimistic updates
   • Offline-resilient with error handling and rollback
   • No duplicate deity names (case-insensitive check)
   • Clean, modern, mobile-responsive UI
   • Keyboard accessible (Space/Enter to increment)
   • Secure (users can only access their own data)

🔒 SECURITY:
   • Firestore rules ensure users only access their own data
   • Each user's counters stored under /users/{uid}/counters/
   • Authentication required for all operations

💡 USAGE:
   1. Sign in with Google (button or One-Tap prompt)
   2. Add deity name in the input field
   3. Click the counter card to open full-screen counter
   4. Tap the large circular button to increment
   5. Counts auto-save to Firestore instantly
   6. Delete counters with the 🗑️ icon
